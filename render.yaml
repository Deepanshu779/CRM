services:
  - type: web
    name: crm-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATA_DIR
        value: /data
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: crm-data
      mountPath: /data
      sizeGB: 1
